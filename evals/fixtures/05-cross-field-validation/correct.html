<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Create account</title>
  <style>
    body { font-family: sans-serif; margin: 3rem auto; max-width: 30rem; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input { width: 100%; padding: .5rem; }
    button { margin-top: 1.5rem; padding: .6rem 1.2rem; }
    .error { color: #b42318; min-height: 1.2rem; }
  </style>
</head>
<body>
  <h1>Create account</h1>
  <!-- No planted defect: the cross-field rule is enforced in code and reported.
       Deliberately not a native constraint — the browser cannot express "these two
       must match", which is why this class of bug is common. -->
  <form id="signup">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email">

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="new-password">

    <label for="confirm">Confirm password</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password">

    <button type="submit">Create account</button>
  </form>
  <p class="error" id="error" role="alert"></p>
  <script>
    document.getElementById('signup').addEventListener('submit', function (e) {
      e.preventDefault();
      var password = document.getElementById('password').value;
      var confirm = document.getElementById('confirm').value;
      var error = document.getElementById('error');
      error.textContent = '';
      if (!password) {
        error.textContent = 'Enter a password';
        document.getElementById('password').focus();
      } else if (password !== confirm) {
        error.textContent = 'The passwords do not match';
        document.getElementById('confirm').focus();
      }
    });
  </script>
</body>
</html>
