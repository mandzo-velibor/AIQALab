<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Search</title>
  <style>
    body { font-family: sans-serif; margin: 3rem auto; max-width: 36rem; }
    input { width: 100%; padding: .5rem; }
  </style>
</head>
<body>
  <h1>Search</h1>
  <label for="q">Search products</label>
  <input id="q" name="q" type="search">
  <p id="results"></p>
  <!-- No planted defect: the query is inserted as text, so it is displayed
       literally and never parsed as markup. -->
  <script>
    document.getElementById('q').addEventListener('input', function () {
      var out = document.getElementById('results');
      out.textContent = '';
      var strong = document.createElement('b');
      strong.textContent = this.value;
      out.appendChild(document.createTextNode('No results for '));
      out.appendChild(strong);
    });
  </script>
</body>
</html>
