<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in</title>
  <style>
    body { font-family: sans-serif; margin: 3rem auto; max-width: 30rem; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input { width: 100%; padding: .5rem; }
    button { margin-top: 1.5rem; padding: .6rem 1.2rem; }
    .error { color: #b42318; min-height: 1.2rem; margin-top: .5rem; }
  </style>
</head>
<body>
  <h1>Sign in</h1>
  <!-- No planted defect: an empty submit produces a visible, announced message. -->
  <form id="login">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username">

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password">

    <button type="submit">Sign in</button>
  </form>
  <p class="error" id="error" role="alert"></p>
  <script>
    document.getElementById('login').addEventListener('submit', function (e) {
      e.preventDefault();
      var u = document.getElementById('username').value;
      var p = document.getElementById('password').value;
      var message = '';
      if (!u) { message = 'Enter a username'; }
      else if (!p) { message = 'Enter a password'; }
      var error = document.getElementById('error');
      error.textContent = message;
      if (message) { document.getElementById('username').focus(); }
    });
  </script>
</body>
</html>
