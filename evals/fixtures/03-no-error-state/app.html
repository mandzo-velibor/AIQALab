<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in</title>
  <style>
    body { font-family: sans-serif; margin: 3rem auto; max-width: 30rem; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input { width: 100%; padding: .5rem; }
    button { margin-top: 1.5rem; padding: .6rem 1.2rem; }
  </style>
</head>
<body>
  <h1>Sign in</h1>
  <form id="login">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username">

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password">

    <button type="submit">Sign in</button>
  </form>
  <!-- PLANTED DEFECT (no-error-state): submitting an empty form does nothing at
       all. No message, no alert, no focus move. The user is left with a form that
       appears to have been ignored, and a screen reader is given nothing. -->
  <script>
    document.getElementById('login').addEventListener('submit', function (e) {
      e.preventDefault();
    });
  </script>
</body>
</html>
