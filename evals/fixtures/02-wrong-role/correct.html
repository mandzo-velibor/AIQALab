<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Checkout</title>
  <style>
    body { font-family: sans-serif; margin: 3rem auto; max-width: 32rem; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input, select { width: 100%; padding: .5rem; }
    button { margin-top: 1.5rem; padding: .6rem 1.2rem; }
  </style>
</head>
<body>
  <h1>Checkout</h1>
  <!-- No planted defect: a real radio group, operable by keyboard. -->
  <form id="checkout">
    <label for="card">Card number</label>
    <input id="card" name="card" type="text" autocomplete="cc-number">

    <fieldset>
      <legend>Payment method</legend>
      <input type="radio" id="method-card" name="method" value="card" checked>
      <label for="method-card">Card</label>
      <input type="radio" id="method-invoice" name="method" value="invoice">
      <label for="method-invoice">Invoice</label>
    </fieldset>

    <button type="submit">Pay</button>
  </form>
  <script>
    document.getElementById('checkout').addEventListener('submit', function (e) {
      e.preventDefault();
    });
  </script>
</body>
</html>
