name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-build:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js 20 (for Playwright browsers)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright browsers
        run: npx --yes playwright@1.48.0 install chromium --with-deps

      - name: Build with Maven
        run: mvn -B verify
        working-directory: backend
        env:
          DATABASE_URL: jdbc:h2:mem:testdb
          DATABASE_USERNAME: sa
          DATABASE_PASSWORD: ""

  frontend-build:
    name: Frontend build & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: frontend

  security-check:
    name: Secrets & env check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure .env and keys are not committed
        run: |
          set -e
          if git ls-files | grep -E '(^|/)\.env$|\.env\.local$'; then
            echo "ERROR: .env files are tracked by git - remove them before committing."
            exit 1
          fi
          if git grep -nE 'sk-[A-Za-z0-9]{20,}|AIzaSy[A-Za-z0-9_\-]{30,}' -- . | grep -v 'README\|\.example'; then
            echo "ERROR: potential API keys found in tracked files."
            exit 1
          fi
          echo "OK: no .env or secrets tracked"

      - name: Validate docker-compose
        run: docker compose config --quiet

  docker-build:
    name: Docker images build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t qalab-backend:ci .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t qalab-frontend:ci .
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
