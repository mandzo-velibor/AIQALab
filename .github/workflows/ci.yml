name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-build:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js 20 (for Playwright browsers)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright browsers
        run: npx --yes playwright@1.48.0 install chromium --with-deps

      - name: Build with Maven
        run: mvn -B verify
        working-directory: backend
        env:
          DATABASE_URL: jdbc:h2:mem:testdb
          DATABASE_USERNAME: sa
          DATABASE_PASSWORD: ""

  # B-014: proves the Flyway migrations and the JPA entities have not drifted apart.
  # Tests run on H2 with Flyway disabled, so nothing else in this pipeline would catch
  # a migration that no longer matches the model. This job starts the real application
  # against a real PostgreSQL with ddl-auto=validate: Flyway applies the migrations to
  # an empty database and Hibernate then refuses to start if the resulting schema does
  # not match the entities.
  flyway-verify:
    name: Flyway migrations match the JPA entities
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: qalab
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setupup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Apply migrations and validate against the entities
        working-directory: backend
        run: |
          set -o pipefail
          timeout 300 mvn -B spring-boot:run             -Dspring-boot.run.arguments="--spring.datasource.url=jdbc:postgresql://localhost:5432/qalab --spring.datasource.username=postgres --spring.datasource.password=postgres --spring.jpa.hibernate.ddl-auto=validate --qalab.auto-start-frontend=false --qalab.auto-open-browser=false --qalab.auto-install-playwright=false --qalab.security.require-api-key=false"             > /tmp/flyway-verify.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 60); do
            if grep -q "Started QaLabAiApplication" /tmp/flyway-verify.log 2>/dev/null; then
              echo "Application started: migrations applied and schema validated."
              grep -E "Successfully applied|Schema .* up to date" /tmp/flyway-verify.log || true
              kill $APP_PID 2>/dev/null || true
              exit 0
            fi
            if ! kill -0 $APP_PID 2>/dev/null; then
              break
            fi
            sleep 5
          done
          echo "::error::Application did not start — migrations and entities likely disagree."
          tail -60 /tmp/flyway-verify.log
          exit 1

  frontend-build:
    name: Frontend build & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: frontend

      # B-038. `next build` and eslint passing says nothing about behaviour: a wrong API
      # path or a dropped request field still builds, lints and renders. These are the
      # checks that would have caught B-033's migration going wrong.
      - name: Unit tests
        run: npm test
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # Separate from `npm test` because it needs a browser and two servers. It boots a
      # stub backend alongside the app, which matters because `app/projects/[id]` is a
      # server component: a browser-only stub would leave it empty and the suite would pass
      # without ever exercising it.
      - name: End-to-end journey
        run: npm run test:e2e
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3199

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  security-check:
    name: Secrets & env check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure .env and keys are not committed
        run: |
          set -e
          if git ls-files | grep -E '(^|/)\.env$|\.env\.local$'; then
            echo "ERROR: .env files are tracked by git - remove them before committing."
            exit 1
          fi
          if git grep -nE 'sk-[A-Za-z0-9]{20,}|AIzaSy[A-Za-z0-9_\-]{30,}' -- . | grep -v 'README\|\.example'; then
            echo "ERROR: potential API keys found in tracked files."
            exit 1
          fi
          echo "OK: no .env or secrets tracked"

      - name: Validate docker-compose
        run: docker compose config --quiet

  docker-build:
    name: Build & push images (GHCR)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository for GHCR
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/backend:latest
            ghcr.io/${{ steps.repo.outputs.name }}/backend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || 'http://localhost:8080' }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/frontend:latest
            ghcr.io/${{ steps.repo.outputs.name }}/frontend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # B-034: the product claims it finds defects. This is the only job that measures
  # whether that is still true. Runs the golden suite against pages with known planted
  # defects and fails if defect recall drops below the committed baseline.
  #
  # A separate job from backend-build because it needs `npm install` in evals/golden and
  # a matching browser; without those the harness correctly skips, which would make the
  # check silently absent rather than green.
  eval-recall:
    name: Eval — defect recall
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the eval suite's dependencies
        run: npm install --no-audit --no-fund
        working-directory: evals/golden

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: evals/golden

      - name: Score defect recall against the committed baseline
        run: mvn -B test -Dtest=DefectRecallHarnessTest -DfailIfNoTests=false
        working-directory: backend
        env:
          DATABASE_URL: jdbc:h2:mem:testdb
          DATABASE_USERNAME: sa
          DATABASE_PASSWORD: ""

      - name: Publish the score
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defect-recall
          path: evals/last-run.json
          if-no-files-found: ignore
