spring:
  profiles:
    active: dev

  application:
    name: qalab-ai

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/qalab}
    username: ${DATABASE_USERNAME:qalab}
    password: ${DATABASE_PASSWORD:qalab}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

qalab:
  screenshots-dir: ./screenshots
  workspaces-dir: ./workspaces

openai:
  api-key: ${OPENAI_API_KEY:}
  model: gpt-4o-mini

opencode:
  go:
    api-key: ${OPENCODE_GO_API_KEY:}
    model: qwen3.7-plus
  zen:
    api-key: ${OPENCODE_ZEN_API_KEY:}
    model: big-pickle
    fallback-model: ${OPENCODE_ZEN_FALLBACK_MODEL:mimo-v2.5-free}

gemini:
  api-key: ${GEMINI_API_KEY:}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
  model: gemini-1.5-flash

ollama:
  api-key: ${OLLAMA_API_KEY:}
  base-url: ${OLLAMA_BASE_URL:https://ollama.com/v1}
  model: ${OLLAMA_MODEL:gpt-oss:20b}

logging:
  level:
    com.qalab.qalabai: INFO
