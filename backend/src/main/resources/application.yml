spring:
  profiles:
    active: dev

  application:
    name: qalab-ai
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/qalab}
    username: ${DATABASE_USERNAME:qalab}
    password: ${DATABASE_PASSWORD:qalab}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway owns the schema (B-014). `update` is banned: it silently mutates a
      # database to match the current entities, so a deploy becomes an unreviewed
      # migration and two instances can disagree. `validate` makes the application
      # REFUSE TO START if the migrations and the entities have drifted, which turns
      # the baseline into a checked contract.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

qalab:
  screenshots-dir: ./screenshots
  workspaces-dir: ./workspaces
  artifacts-dir: ${QALAB_ARTIFACTS_DIR:./artifacts}
  auto-start-frontend: true
  auto-open-browser: true
  auto-install-playwright: true
  # Wall-clock budget for one Playwright run. Always finite so a hung run cannot
  # pin a request thread forever; raise it for very large suites.
  playwright:
    timeout-seconds: 600
    # Artifact profile for GENERATED workspaces. The defaults capture evidence for
    # failures only: recording video and a trace for every passing test is a large
    # disk and wall-clock cost and buries the failures that matter. A workspace
    # that already has its own playwright.config.ts is never modified.
    screenshot: only-on-failure
    video: off
    trace: retain-on-failure
    # Playwright worker count. 0 = auto (cores - 1, minimum 1). Unset, Playwright
    # spawns ~half the cores as browser contexts, which thrashes memory and causes
    # timeouts on the small VMs this usually runs on. Set explicitly on a shared host.
    workers: 0
    # Per-test and per-expectation timeouts baked into generated configs.
    test-timeout-ms: 30000
    expect-timeout-ms: 5000
  workflow:
    # The full-test workflow runs off the request thread (B-017). Each worker holds a
    # headless browser and a test suite, so the pool is small by default. The queue
    # absorbs a burst; beyond it the caller gets 429 with a retry hint rather than
    # the node silently accepting work it cannot finish.
    workers: ${QALAB_WORKFLOW_WORKERS:2}
    queue-capacity: ${QALAB_WORKFLOW_QUEUE_CAPACITY:20}
  security:
    # Require a bearer API key on /api/**. When false (the default) a key is enforced
    # only if one has been issued, so a fresh local install works with zero setup while
    # a deployed instance switches to protected as soon as it has a key. Set true to
    # force enforcement. See docs/adr/0001-authentication-and-tenancy.md.
    require-api-key: ${QALAB_REQUIRE_API_KEY:false}
  cors:
    # Comma-separated browser origins allowed to call /api/**. Must be set for any
    # deployment that is not on localhost, or every frontend call is blocked by the
    # browser. Credentials are enabled, so "*" is rejected (see WebConfig).
    allowed-origins: ${QALAB_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  ai:
    # ---- AI gateway ----
    # Provider used when a request does not name one. AIQALAB is the managed
    # (server-key) provider, which is the only path with a cross-provider cascade.
    default-provider: AIQALAB
    # MANAGED = server keys, BYOK = per-user keys, LOCAL = Ollama on localhost.
    default-credential-mode: MANAGED
    # Monthly allowance for MANAGED mode. 0 = unlimited.
    #
    # The code default was 4000, which is BELOW a single full workflow run: one run
    # sends 6-7 prompts containing full simplified page HTML. On a default local
    # start that produced AI_BUDGET_EXCEEDED before any useful work completed. Set
    # this deliberately rather than relying on the code default.
    free-monthly-token-limit: ${QALAB_AI_FREEMONTHLYTOKENLIMIT:0}
    max-retries: 2
    retry-backoff-ms: 1500
    # Token-bucket rate limiting on AI calls, per provider and per account. Off by
    # default so local behaviour is unchanged; turn it on for any shared deployment.
    # A workflow legitimately fires several calls in quick succession, so the buckets
    # allow bursts and bound the sustained rate rather than capping requests per second.
    rate-limit-enabled: ${QALAB_AI_RATE_LIMIT_ENABLED:false}
    rate-limit-provider-rps: 2.0
    rate-limit-provider-burst: 10
    rate-limit-account-rps: 1.0
    rate-limit-account-burst: 5
    # Per-provider endpoints. Without these, resolveModel() returns null and
    # bring-your-own-key providers receive {"model": null}, which they reject.
    # The key is the lowercased AiProviderType name.
    providers:
      # AIQALAB is the managed provider served by OpenCodeManagedProviderClient. The
      # client runs its own cross-provider cascade and reads its own model settings,
      # so this entry exists only so a model always resolves for the gateway.
      aiqalab:
        model: ${AIQALAB_MODEL:big-pickle}
      opencode:
        model: ${OPENCODE_MODEL:qwen3.7-plus}
      openai:
        base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
        model: ${OPENAI_MODEL:gpt-4o-mini}
      anthropic:
        base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
        model: ${ANTHROPIC_MODEL:claude-sonnet-4-5}
      google:
        base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
        model: ${GEMINI_MODEL:gemini-1.5-flash}
      ollama:
        base-url: ${OLLAMA_BASE_URL:https://ollama.com/v1}
        model: ${OLLAMA_MODEL:gpt-oss:20b}
    # Outbound AI HTTP timeouts. Both must be finite: the default RestTemplate
    # uses infinite timeouts, so a provider that accepts the connection and then
    # stalls would never raise and the gateway could neither retry nor fail over.
    # The read timeout is generous because long generations legitimately take
    # minutes, but it is not unbounded.
    connect-timeout-ms: 10000
    read-timeout-ms: 180000

openai:
  api-key: ${OPENAI_API_KEY:}
  model: gpt-4o-mini

opencode:
  # Hard ceiling on upstream LLM calls for one logical operation, across the whole
  # provider cascade (B-024). It used to be an outer retry loop of 3 wrapped around a
  # 5-provider cascade, so one operation could make 15 upstream calls — with a backoff
  # sleep between the outer attempts, on top.
  #
  # The default of 6 is sized to the configured cascade: Go, Zen(space-bunny-free),
  # Zen(big-pickle), Gemini and Ollama is 5 candidates, so 6 leaves room for one retry
  # of a provider that failed once. The bound is the point, not the number: 6 is still
  # less than half the old worst case, and a cascade that can always reach its last
  # resort is a serial retry storm rather than a fallback.
  max-provider-calls: ${OPENCODE_MAX_PROVIDER_CALLS:6}
  # How many times one provider may be tried before it is abandoned, so a single flaky
  # provider cannot consume the whole budget on its own.
  max-attempts-per-provider: ${OPENCODE_MAX_ATTEMPTS_PER_PROVIDER:2}
  go:
    api-key: ${OPENCODE_GO_API_KEY:}
    model: qwen3.7-plus
  zen:
    api-key: ${OPENCODE_ZEN_API_KEY:}
    # Tried in order, ahead of the free Gemini and Ollama candidates.
    model: ${OPENCODE_ZEN_MODEL:space-bunny-free}
    fallback-model: ${OPENCODE_ZEN_FALLBACK_MODEL:big-pickle}

gemini:
  api-key: ${GEMINI_API_KEY:}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  model: gemini-1.5-flash-latest

ollama:
  api-key: ${OLLAMA_API_KEY:}
  base-url: ${OLLAMA_BASE_URL:https://ollama.com/v1}
  model: ${OLLAMA_MODEL:gpt-oss:20b}

logging:
  level:
    com.qalab.qalabai: INFO
