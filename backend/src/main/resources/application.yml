spring:
  profiles:
    active: dev

  application:
    name: qalab-ai

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/qalab}
    username: ${DATABASE_USERNAME:qalab}
    password: ${DATABASE_PASSWORD:qalab}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

qalab:
  screenshots-dir: ./screenshots
  workspaces-dir: ./workspaces

openai:
  api-key: ${OPENAI_API_KEY:}
  model: gpt-4o-mini

opencode:
  go:
    api-key: ${OPENCODE_GO_API_KEY:}
    model: qwen3.7-plus
  zen:
    api-key: ${OPENCODE_ZEN_API_KEY:}
    model: big-pickle

logging:
  level:
    com.qalab.qalabai: INFO
