# Prompt manifest — B-035
#
# The prompt is the product: it is the one asset with no safety net, and before this file
# existed a prompt edit looked exactly like a provider or model change when something
# regressed. Each line pins a template to the exact text that was evaluated:
#
#     <name>=<sha256-prefix>,<eval citation>
#
# `PromptManifestTest` fails the build when a template's content hash drifts from the value
# here. That is the enforcement behind "prompt diffs require an eval run": to change a
# prompt you must run the B-034 harness and record the resulting score here, so the diff and
# its measured effect travel together in the same commit.
#
# To update after an intentional prompt change:
#   1. edit prompts/<name>.md
#   2. run the harness:  mvn test -Dtest=DefectRecallHarnessTest
#   3. copy the new hash:  shasum -a 256 prompts/<name>.md | cut -c1-12
#   4. update the line below, citing the score you measured and what changed
#
# The citation is required to be non-empty. "trust me" is not a measurement, and an entry
# without one is what makes this file decay into a list of hashes nobody reads.

# Baseline for every entry: the B-034 golden suite as committed in d9a7453 —
# 5/5 defects caught, 0 false positives, 0 flakes.
