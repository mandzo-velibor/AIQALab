spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/qalab}
    username: ${DATABASE_USERNAME:qalab}
    password: ${DATABASE_PASSWORD:qalab}

  jpa:
    hibernate:
      # Flyway owns the schema in every profile, dev included (B-014).
      ddl-auto: validate
    show-sql: false

logging:
  level:
    com.qalab.qalabai: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: WARN
