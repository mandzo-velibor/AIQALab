name: ai-qa-lab

services:
  db:
    image: postgres:16-alpine
    container_name: qalab-db
    environment:
      POSTGRES_DB: qalab
      POSTGRES_USER: qalab
      POSTGRES_PASSWORD: qalab
    ports:
      - "5432:5432"
    volumes:
      - qalab-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qalab -d qalab"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: qalab-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/qalab
      DATABASE_USERNAME: qalab
      DATABASE_PASSWORD: qalab
      QALAB_AUTO_START_FRONTEND: "false"
      QALAB_AUTO_OPEN_BROWSER: "false"
      QALAB_AUTO_INSTALL_PLAYWRIGHT: "true"
      QALAB_WORKSPACES_DIR: /app/workspaces
      QALAB_SCREENSHOTS_DIR: /app/screenshots
      # AI provider keys come from the host .env file (never committed)
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
      OPENCODE_ZEN_API_KEY: ${OPENCODE_ZEN_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - qalab-workspaces:/app/workspaces
      - qalab-screenshots:/app/screenshots

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: qalab-frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"

volumes:
  qalab-db-data:
  qalab-workspaces:
  qalab-screenshots:
